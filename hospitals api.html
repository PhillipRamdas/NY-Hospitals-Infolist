<!DOCTYPE html>
<html>
<head>
  <title>NYC Hospitals Map</title>
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>

<h2 style="text-align:center;">NYC Hospitals Map</h2>
<div id="map"></div>

<script>
  function initMap() {
    // Center map on NYC
    const nyc = { lat: 40.7128, lng: -74.0060 };

    const map = new google.maps.Map(document.getElementById("map"), {
      zoom: 12,
      center: nyc,
    });

    // Hospital data with custom descriptions
    const hospitals = [
      {
        name: "Mount Sinai Hospital",
        position: { lat: 40.7901, lng: -73.9533 },
        description: "Top-ranked hospital known for cardiology and research."
      },
      {
        name: "NYU Langone Health",
        position: { lat: 40.7420, lng: -73.9749 },
        description: "Highly rated for patient care and surgical specialties."
      },
      {
        name: "NewYork-Presbyterian Hospital",
        position: { lat: 40.8417, lng: -73.9415 },
        description: "Major teaching hospital affiliated with Columbia University."
      },
      {
        name: "Bellevue Hospital",
        position: { lat: 40.7391, lng: -73.9754 },
        description: "One of the oldest public hospitals in the U.S."
      }
    ];

    // Add markers
    hospitals.forEach(hospital => {
      const marker = new google.maps.Marker({
        position: hospital.position,
        map: map,
        title: hospital.name
      });

      const infoWindow = new google.maps.InfoWindow({
        content: `<h3>${hospital.name}</h3><p>${hospital.description}</p>`
      });

      marker.addListener("click", () => {
        infoWindow.open(map, marker);
      });
    });
  }
</script>

<!-- Replace YOUR_API_KEY with your actual key -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBZC9qQR3UO7M4bZ1xSCApM2HY3l98fEQg&callback=initMap">
</script>

</body>
</html>
