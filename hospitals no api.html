<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NYC Hospital Map</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      display: flex;
      height: 100vh;
    }

    /* Sidebar */
    #sidebar {
      width: 30%;
      background: #f4f4f4;
      overflow-y: auto;
      padding: 20px;
      border-right: 1px solid #ccc;
    }

    #sidebar h2 {
      margin-top: 0;
    }

    .hospital {
      padding: 12px;
      margin-bottom: 10px;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .hospital:hover {
      background: #e0f0ff;
    }

    /* Main content */
    #main {
      width: 70%;
      display: flex;
      flex-direction: column;
    }

    iframe {
      width: 100%;
      height: 70%;
      border: none;
    }

    #info {
      padding: 15px;
      background: #fafafa;
      height: 30%;
      border-top: 1px solid #ccc;
    }

    #info h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <h2>NYC Hospitals</h2>

    <div class="hospital" onclick="showHospital(
      'Mount Sinai Hospital NYC',
      'Mount Sinai Hospital',
      'Top-ranked hospital known for cardiology, neurology, and research excellence.'
    )">
      Mount Sinai Hospital
    </div>

    <div class="hospital" onclick="showHospital(
      'NYU Langone Health NYC',
      'NYU Langone Health',
      'Highly rated for orthopedic surgery, cancer care, and patient safety.'
    )">
      NYU Langone Health
    </div>

    <div class="hospital" onclick="showHospital(
      'NewYork-Presbyterian Hospital NYC',
      'NewYork-Presbyterian',
      'One of the largest hospitals in NYC with strong emergency and specialty care.'
    )">
      NewYork-Presbyterian
    </div>

    <div class="hospital" onclick="showHospital(
      'Bellevue Hospital NYC',
      'Bellevue Hospital',
      'America’s oldest public hospital with a major trauma center.'
    )">
      Bellevue Hospital
    </div>

  </div>

  <!-- Main Content -->
  <div id="main">

    <iframe id="map"
      src="https://www.google.com/maps?q=New+York+City&output=embed">
    </iframe>

    <div id="info">
      <h3>Select a hospital</h3>
      <p>Click a hospital from the list to view details.</p>
    </div>

  </div>

  <!-- Script -->
  <script>
    function showHospital(query, name, description) {
      // Update map
      document.getElementById("map").src =
        "https://www.google.com/maps?q=" + encodeURIComponent(query) + "&output=embed";

      // Update info panel
      document.getElementById("info").innerHTML =
        "<h3>" + name + "</h3><p>" + description + "</p>";
    }
  </script>

</body>
</html>
